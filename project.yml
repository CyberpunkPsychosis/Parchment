name: FLOW
options:
  bundleIdPrefix: com.flow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
targets:
  FLOW:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FlowApp/Sources
      - path: FlowApp/Resources
    info:
      path: FlowApp/Info.plist
      properties:
        CFBundleDisplayName: 羊皮纸
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 语音消息录制需要麦克风权限
        NSMicrophoneUsageDescription: "录制语音消息需要使用麦克风"
        # 本地开发：允许连本机 HTTP 后端（localhost）。上线走 HTTPS 时可移除。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
